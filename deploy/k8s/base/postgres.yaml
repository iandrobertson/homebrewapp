apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homebrew-pg
  namespace: homebrew
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: homebrew
      owner: brew_migrate
      postInitApplicationSQL:
        - CREATE ROLE brew_auth LOGIN PASSWORD 'change-me-auth' BYPASSRLS
        - CREATE ROLE brew_app LOGIN PASSWORD 'change-me-app'
        - CREATE ROLE brew_rls_helper NOLOGIN BYPASSRLS
  backup:
    barmanObjectStore:
      destinationPath: s3://homebrew-pg-backups
      s3Credentials:
        accessKeyId:
          name: homebrew-pg-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: homebrew-pg-backup
          key: ACCESS_SECRET_KEY
    retentionPolicy: "30d"
  monitoring:
    enablePodMonitor: true
